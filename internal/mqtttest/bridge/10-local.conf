# Mirror of the local broker config installed on the UPS host by the
# separate host-setup project (conf.d/10-local.conf there), with site
# identifiers removed.  StartBridged runs it with the substitutions it
# lists; keep this in step with the original.
per_listener_settings true

listener 1883 127.0.0.1
allow_anonymous true

listener 1884
allow_anonymous false
password_file /etc/mosquitto/passwd

autosave_interval 300

max_queued_messages 100000
max_queued_bytes 67108864
