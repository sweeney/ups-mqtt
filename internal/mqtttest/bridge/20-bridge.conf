# Mirror of the bridge config installed on the UPS host by the separate
# host-setup project (conf.d/20-bridge-<broker>.conf there), with site
# identifiers removed.  StartBridged runs it with the substitutions it
# lists; keep this in step with the original.
connection uplink

address broker.example-tailnet.ts.net:1883 100.64.0.20:1883
round_robin false

remote_clientid bridge-ups-host
cleansession false

keepalive_interval 30
restart_timeout 5 60

notifications true
notification_topic sites/site/bridge

topic ups/# out 1
topic sites/site/network/# out 1
topic sites/site/selftest out 1
topic climate/site/observation out 1
topic climate/site/device/status out 1
